{{- range $key, $svc := .Values.services }}
{{- $usesDatabase := has $key (list "auth" "product" "order" "payment") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
  labels:
    {{- include "microservices-app.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $svc.name }}
spec:
  replicas: {{ $.Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $svc.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $svc.name }}
    spec:
      {{- if $.Values.migrations.enabled }}
      initContainers:
        - name: wait-for-database-migration
          image: "{{ $svc.image }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              attempt=0
              until python -c 'from sqlalchemy import text; from shared.database import engine; connection = engine.connect(); row = connection.execute(text("SELECT version_num FROM alembic_version")).first(); connection.close(); assert row' >/dev/null 2>&1; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 150 ]; then
                  echo "Timed out waiting for database migration" >&2
                  exit 1
                fi
                sleep 2
              done
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: {{ $.Values.postgres.database | quote }}
            - name: DB_USER
              value: {{ $.Values.postgres.username | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secret.name }}
                  key: {{ $.Values.secret.postgresPasswordKey }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: {{ $svc.name }}
          image: "{{ $svc.image }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
              protocol: TCP
          {{- if or (eq $key "gateway") (eq $key "order") }}
          envFrom:
            - configMapRef:
                name: {{ include "microservices-app.fullname" $ }}-config
          {{- end }}
          {{- if or $svc.jwtSecret $usesDatabase }}
          env:
            {{- if $svc.jwtSecret }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secret.name }}
                  key: {{ $.Values.secret.jwtKey }}
            {{- end }}
            {{- if eq $key "payment" }}
            - name: PAYMENT_SIMULATED_OUTCOME
              value: {{ $.Values.payment.simulatedOutcome | quote }}
            {{- end }}
            {{- if $usesDatabase }}
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: {{ $.Values.postgres.database | quote }}
            - name: DB_USER
              value: {{ $.Values.postgres.username | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secret.name }}
                  key: {{ $.Values.secret.postgresPasswordKey }}
            {{- end }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ $.Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ $.Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ $.Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ $.Values.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
---
{{- end }}
