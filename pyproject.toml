[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [".git", ".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
exclude = ["tests", "migrations"]