name: Verified Deployment

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_microservices
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: ci-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_microservices"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://test_user:ci-test-only-password@localhost:5432/test_microservices
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --ignore-missing-imports shared services api_gateway
      - run: pytest -v
      - run: pytest -v -m postgresql tests/integration
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - run: helm lint helm/microservices-app
      - run: helm template microservices helm/microservices-app --namespace ci --set image.tag=ci

  build-and-scan:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            module: services.auth_service.app.main:app
          - service: product
            module: services.product_service.app.main:app
          - service: payment
            module: services.payment_service.app.main:app
          - service: order
            module: services.order_service.app.main:app
          - service: gateway
            module: api_gateway.app.main:app
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set immutable image tags
        id: tags
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository="${GITHUB_REPOSITORY#*/}"
          version="${GITHUB_REF_NAME#v}"
          echo "image=ghcr.io/${owner}/${repository}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}:${{ github.sha }}
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.version }}
          build-args: APP_MODULE=${{ matrix.module }}
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.tags.outputs.image }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

  deploy:
    needs: build-and-scan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0
      - name: Configure cluster credentials
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          test -n "$KUBECONFIG_B64"
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: Provision namespace secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          NAMESPACE: ${{ vars.KUBERNETES_NAMESPACE }}
        run: |
          test -n "$JWT_SECRET" && test -n "$POSTGRES_PASSWORD" && test -n "$NAMESPACE"
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" create secret generic app-secrets \
            --from-literal=jwt-secret="$JWT_SECRET" \
            --from-literal=postgres-password="$POSTGRES_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Deploy verified immutable images
        env:
          NAMESPACE: ${{ vars.KUBERNETES_NAMESPACE }}
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
          IMAGE_REPOSITORY: ${{ github.event.repository.name }}
        run: |
          owner="${IMAGE_REGISTRY,,}"
          repository="${IMAGE_REPOSITORY,,}"
          helm upgrade --install microservices helm/microservices-app \
            --namespace "$NAMESPACE" \
            --set-string image.tag="$IMAGE_TAG" \
            --set-string services.auth.image="$owner/$repository-auth" \
            --set-string services.product.image="$owner/$repository-product" \
            --set-string services.payment.image="$owner/$repository-payment" \
            --set-string services.order.image="$owner/$repository-order" \
            --set-string services.gateway.image="$owner/$repository-gateway" \
            --timeout 10m --wait --wait-for-jobs
          kubectl -n "$NAMESPACE" wait --for=condition=available deployment --all --timeout=300s
          kubectl -n "$NAMESPACE" rollout status statefulset/postgres --timeout=300s
      - name: Verify database and gateway
        env:
          NAMESPACE: ${{ vars.KUBERNETES_NAMESPACE }}
        run: |
          kubectl -n "$NAMESPACE" exec postgres-0 -- psql -U microservices -d microservices -Atc \
            "SELECT version_num FROM alembic_version;"
          kubectl -n "$NAMESPACE" port-forward service/api-gateway 18000:8000 > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/health; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/port-forward.log"
          exit 1