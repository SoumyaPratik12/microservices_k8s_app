name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run test suite
        run: pytest -q

      - name: Validate initial Alembic migration on SQLite
        run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./ci-migrations.db

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint helm/microservices-app

      - name: Build Auth image
        run: docker build --build-arg APP_MODULE=services.auth_service.app.main:app -t microservices-k8s-app-auth:0.3.0 .

      - name: Verify Alembic in Auth image
        run: |
          docker run --rm --entrypoint alembic microservices-k8s-app-auth:0.3.0 --version
          docker run --rm --entrypoint sh microservices-k8s-app-auth:0.3.0 -c 'test -f alembic.ini && test -f migrations/versions/608478858234_initial_database_schema.py'

      - name: Build Product image
        run: docker build --build-arg APP_MODULE=services.product_service.app.main:app -t microservices-k8s-app-product:0.3.0 .

      - name: Build Payment image
        run: docker build --build-arg APP_MODULE=services.payment_service.app.main:app -t microservices-k8s-app-payment:0.3.0 .

      - name: Build Order image
        run: docker build --build-arg APP_MODULE=services.order_service.app.main:app -t microservices-k8s-app-order:0.3.0 .

      - name: Build API Gateway image
        run: docker build --build-arg APP_MODULE=api_gateway.app.main:app -t microservices-k8s-app-gateway:0.3.0 .
