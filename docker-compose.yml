services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: microservices
      POSTGRES_USER: microservices
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microservices -d microservices"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  auth-service:
    build:
      context: .
      args:
        APP_MODULE: services.auth_service.app.main:app
    environment:
      PORT: "8000"
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: microservices
      DB_USER: microservices
      DB_PASSWORD: ${POSTGRES_PASSWORD:-development-only-change-me}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  product-service:
    build:
      context: .
      args:
        APP_MODULE: services.product_service.app.main:app
    environment:
      PORT: "8000"
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: microservices
      DB_USER: microservices
      DB_PASSWORD: ${POSTGRES_PASSWORD:-development-only-change-me}
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  payment-service:
    build:
      context: .
      args:
        APP_MODULE: services.payment_service.app.main:app
    environment:
      PORT: "8000"
    ports:
      - "8003:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  order-service:
    build:
      context: .
      args:
        APP_MODULE: services.order_service.app.main:app
    environment:
      PORT: "8000"
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
      PRODUCT_SERVICE_URL: http://product-service:8000
      PAYMENT_SERVICE_URL: http://payment-service:8000
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: microservices
      DB_USER: microservices
      DB_PASSWORD: ${POSTGRES_PASSWORD:-development-only-change-me}
    ports:
      - "8004:8000"
    depends_on:
      postgres:
        condition: service_healthy
      product-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      args:
        APP_MODULE: api_gateway.app.main:app
    environment:
      PORT: "8000"
      AUTH_SERVICE_URL: http://auth-service:8000
      PRODUCT_SERVICE_URL: http://product-service:8000
      ORDER_SERVICE_URL: http://order-service:8000
      PAYMENT_SERVICE_URL: http://payment-service:8000
    ports:
      - "8000:8000"
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
